[book]
title = "Rust Proqramlaşdırma Dili"
authors = ["Steve Klabnik", "Carol Nichols", "Chris Krycho", "Rust icmasının töhfələri ilə"]
language = "az"

[output.html]
additional-css = ["ferris.css", "theme/2018-edition.css", "theme/semantic-notes.css", "theme/listing.css"]
additional-js = ["ferris.js"]
git-repository-url = "https://github.com/hidayatrzayev/rust-book-az"

[output.html.search]
use-boolean-and = true

# Do not sync this preprocessor; it is for the HTML renderer only.
[preprocessor.trpl-note]
command = "cargo run --manifest-path ../rustbook-en/packages/mdbook-trpl/Cargo.toml --bin mdbook-trpl-note"

# Azerbaijani "> Qeyd: " notes → same markup as trpl-note (tools/az_note.py).
[preprocessor.az-note]
command = "python3 ../tools/az_note.py"
before = ["trpl-note"]

[preprocessor.trpl-listing]
command = "cargo run --manifest-path ../rustbook-en/packages/mdbook-trpl/Cargo.toml --bin mdbook-trpl-listing"
output-mode = "default"

[rust]
edition = "2024"

[build]
extra-watch-dirs = ["../rustbook-en/packages/mdbook-trpl"]

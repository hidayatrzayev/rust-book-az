name: CI
on:
  push:
  pull_request:

env:
  MDBOOK_VERSION: 0.5.1

jobs:
  check:
    name: Checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install 1.99
          rustup default 1.99

      - name: Install mdBook
        run: |
          mkdir bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz --directory=bin
          echo "$(pwd)/bin" >> "${GITHUB_PATH}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Tool tests
        run: python -m pytest tools

      - name: Glossary sanity
        run: python tools/glossary.py check

      - name: Listings differ from English only in comments
        run: python tools/check_listings.py

      - name: Chapters keep code, directives and links
        run: python tools/check_chapter.py rustbook-az/src/*.md

      - name: Glossary lint on translated files
        run: |
          files=$(python tools/status.py translated)
          if [ -n "$files" ]; then
            python tools/glossary.py lint $files
          fi

      - name: Glossary appendix is up to date
        run: python tools/glossary.py appendix | diff - rustbook-az/src/appendix-08-glossary.md

      - name: Build book
        run: mdbook build rustbook-az

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: rustbook-az/book

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
